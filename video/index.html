<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHODE Video</title>

<!--
  ============================================================
  ANLEITUNG FÜR SPÄTER:
  Sobald der YouTube-Link feststeht, einfach die Zeile
  unten (YOUTUBE_URL) anpassen. Leer lassen = "Video kommt bald"
  wird weiter angezeigt.
  ============================================================
-->
<script>
  const YOUTUBE_URL = "https://youtu.be/dQw4w9WgXcQ?si=hMCSnS6EeMHcQKY7"; // <-- hier z.B. "https://youtu.be/XXXXXXXXXXX" eintragen

  if (YOUTUBE_URL) {
    window.location.replace(YOUTUBE_URL);
  }
</script>

<style>
  :root {
    --bg: #0f172a;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    margin-top: 24px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">PHODE</div>
    <div class="status">
      <span class="dot"></span>
      Video kommt bald
    </div>
  </div>
</body>
</html>
